# FAST-LIO2 for a hand-carried / pole-mounted Livox Mid-360S.
# Based on FAST-LIO's config/mid360.yaml; changes are commented.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 1              # was 3: keep every point, the colorizer maps them all
        max_iteration: 3
        filter_size_surf: 0.5            # odometry's internal downsampling (not the saved map)
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: ""

        common:
            lid_topic:  "/livox/lidar"   # livox_ros_driver2 CustomMsg (xfer_format 1)
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1                # Livox CustomMsg
            scan_line:  4
            blind: 0.8                   # was 0.5: drops the person carrying the pole
            timestamp_unit: 3            # ns
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            # Mid-360S user manual (v1.0 2026.04): IMU at x=11.0, y=23.29,
            # z=-44.12 mm in point-cloud coordinates -> lidar in IMU frame below.
            # Known, so no online estimation (was true).
            extrinsic_est_en:  false
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en: false
            effect_map_en: false
            map_en: false                # the colorizer builds and publishes the maps
            scan_publish_en:  true
            dense_publish_en: true       # full undistorted scans on /cloud_registered
            scan_bodyframe_pub_en: false

        pcd_save:
            pcd_save_en: false           # maps are saved by the colorizer
            interval: -1
