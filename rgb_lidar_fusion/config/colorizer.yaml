colorizer:
  ros__parameters:
    lidar_topic: /livox/lidar
    image_topic: /camera/camera/color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    scan_mid_offset: 0.05     # livox stamps the sweep start; sweep is 0.1 s
    time_offset: 0.0
    max_dt: 0.05
    max_wait: 0.3             # s, a scan waits this long for an image after its midpoint
    min_range: 0.1
    max_range: 40.0
    occl_cell: 4
    occl_tol: 0.10
    accumulate: false         # true: start recording `map_name` at launch (rig must stay still)
    map_name: ''              # '' -> map_YYYYmmdd_HHMMSS
    voxel: 0.03
    publish_period: 1.0       # s, colored_map
    full_publish_period: 2.0  # s, lidar_map (much larger)
    image_queue: 5            # images held while busy (~6 MB each at 1080p)
    save_on_shutdown: true    # a map still recording at shutdown is saved
