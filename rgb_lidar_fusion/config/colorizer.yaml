colorizer:
  ros__parameters:
    # cloud_topic and scan_mid_offset are set by colorize.launch.py (odometry on/off)
    image_topic: /camera/camera/color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    imu_topic: /livox/imu
    lidar_frame: livox_frame
    map_frame: map
    time_offset: 0.0
    max_dt: 0.05
    max_wait: 0.3             # s, a scan waits this long for an image after its midpoint
    max_ang_rate: 30.0        # deg/s, faster turns are not coloured (still mapped)
    min_range: 0.1
    max_range: 40.0
    occl_cell: 4
    occl_tol: 0.10
    lidar_height: 1.0         # m, lidar origin above the floor at Start (set from the UI)
    static_gyro: 0.05         # rad/s, Start needs the rig held still
    level_window: 1.0         # s of IMU averaged for gravity
    accumulate: false         # true: start recording `map_name` at launch
    map_name: ''              # '' -> map_YYYYmmdd_HHMMSS
    voxel: 0.03               # m, saved maps
    display_voxel: 0.10       # m, live full map sent to viewers
    publish_period: 1.0       # s, colored_map
    full_publish_period: 2.0  # s, lidar_map
    image_queue: 5            # images held while busy (~6 MB each at 1080p)
    save_on_shutdown: true    # a map still recording at shutdown is saved
    # Robot exports written next to each saved map: the map re-expressed as if
    # the robot's lidar had started where the rig's lidar did.
    # flip: true only if the robot's driver reports its lidar upside down
    # (a livox driver configured with roll 180 already corrects it).
    export_names: [go2, g1]
    export_heights: [0.45, 1.25]
    export_flip: [false, false]
