name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in what you can; logs and versions help most.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker/run.sh
        2. ros2 launch rgb_lidar_fusion colorize.launch.py ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `ros2 launch` (and the browser console for web UI problems).
      render: text
  - type: input
    id: lidar
    attributes:
      label: LiDAR model and firmware
      placeholder: e.g. Livox Mid-360S, firmware 35.1.0113
  - type: input
    id: camera
    attributes:
      label: Camera model
      placeholder: e.g. RealSense D435i
  - type: input
    id: version
    attributes:
      label: RGB-LiDAR-Fusion version or commit
      placeholder: e.g. v0.1.0 or 6e9ec7a
  - type: input
    id: host
    attributes:
      label: Host OS / Docker version
      placeholder: e.g. Ubuntu 22.04, Docker 27
